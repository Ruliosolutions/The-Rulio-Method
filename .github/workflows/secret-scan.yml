name: Secret scan

# Blocks any commit that contains API keys, tokens, or credentials.
# Catches Stripe (sk_live_/sk_test_/whsec_), Supabase (sb_secret_/sb_publishable_),
# Resend (re_), PostHog (phc_), OpenAI (sk-/), Google (AIza), and PATs (ghp_).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for known secret patterns
        run: |
          echo "Scanning for leaked secrets..."
          PATTERNS=(
            "sk_live_[a-zA-Z0-9]{20,}"
            "sk_test_[a-zA-Z0-9]{20,}"
            "whsec_[a-zA-Z0-9]{20,}"
            "sb_secret_[a-zA-Z0-9_-]{20,}"
            "sb_publishable_[a-zA-Z0-9_-]{20,}"
            "re_[a-zA-Z0-9]{20,}"
            "phc_[a-zA-Z0-9]{20,}"
            "sk-[a-zA-Z0-9]{20,}T3BlbkFJ[a-zA-Z0-9]{20,}"
            "AIza[a-zA-Z0-9_-]{30,}"
            "ghp_[a-zA-Z0-9]{30,}"
            "github_pat_[a-zA-Z0-9_]{50,}"
          )
          FAILED=0
          for PATTERN in "${PATTERNS[@]}"; do
            HITS=$(git grep -nE "$PATTERN" || true)
            if [ -n "$HITS" ]; then
              echo "❌ Found potential secret matching: $PATTERN"
              echo "$HITS"
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "::error::Secrets detected. Move them to .env.local (gitignored) or your hosting provider's secret store, then re-commit."
            exit 1
          fi
          echo "✓ No secrets found"
